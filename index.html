<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Saver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="glass-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">✦</span>
        Link Saver
      </div>
      <button id="openModal" class="btn-primary">+ Add Link</button>
    </div>
  </header>

  <main class="main-content">
    <div class="tag-bar" id="tagBar" hidden></div>
    <div class="links-grid" id="linksGrid"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔗</div>
      <h2>No links saved yet</h2>
      <p>Click <strong>+ Add Link</strong> to save your first URL.</p>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Add Link</h2>
        <button class="modal-close" id="closeModal" aria-label="Close">✕</button>
      </div>
      <form id="linkForm" novalidate>
        <div class="field">
          <label for="inputUrl">URL <span class="required">*</span></label>
          <input type="url" id="inputUrl" placeholder="https://example.com" autocomplete="off" required>
          <span class="field-error" id="urlError">Please enter a valid URL.</span>
        </div>
        <div class="field">
          <label for="inputTitle">Title</label>
          <input type="text" id="inputTitle" placeholder="Page title (optional)" autocomplete="off">
        </div>
        <div class="field">
          <label for="inputNote">Note</label>
          <input type="text" id="inputNote" placeholder="Short note (optional)" autocomplete="off">
        </div>
        <div class="field">
          <label>Tags</label>
          <div class="tag-input-wrapper" id="tagInputWrapper">
            <div class="tag-pills-input" id="tagPillsInput"></div>
            <input type="text" id="inputTag" placeholder="Type a tag + Enter" autocomplete="off">
          </div>
          <span class="field-hint">Press Enter or comma to add a tag</span>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelModal" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Link</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
